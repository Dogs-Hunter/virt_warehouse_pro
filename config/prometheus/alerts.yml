groups:
  - name: warehouse-critical
    rules:
      - alert: WarehouseNodeDown
        expr: up{job="warehouse"} == 0
        for: 15s
        labels: { severity: critical }
        annotations: { summary: "Warehouse application node is unavailable" }
      - alert: WarehouseQuorumUnavailable
        expr: max(warehouse_quorum_available) == 0
        for: 5s
        labels: { severity: critical }
        annotations: { summary: "JetStream quorum is unavailable" }
      - alert: WarehouseNoWriter
        expr: sum(warehouse_writer_lease_owned) == 0
        for: 10s
        labels: { severity: critical }
        annotations: { summary: "No application owns the writer lease" }
      - alert: WarehouseMultipleWriters
        expr: sum(warehouse_writer_lease_owned) > 1
        for: 2s
        labels: { severity: critical }
        annotations: { summary: "More than one writer lease is reported" }
      - alert: WarehouseReplicationLag
        expr: max(warehouse_replication_lag) > 5
        for: 15s
        labels: { severity: warning }
        annotations: { summary: "Application replication checkpoint is behind" }
      - alert: WarehouseHistoryBackfillLag
        expr: max(warehouse_history_lag) > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Durable history indexes are still behind the canonical log" }
      - alert: WarehouseUnavailableResponses
        expr: sum(rate(warehouse_unavailable_total[1m])) > 0
        for: 30s
        labels: { severity: warning }
        annotations: { summary: "Warehouse is returning storage-unavailable responses" }
      - alert: WarehouseHighMemory
        expr: max(warehouse_process_memory_bytes) > 1073741824
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Warehouse process RSS exceeds 1 GiB" }
      - alert: WarehouseCanonicalLogNearCapacity
        expr: max(warehouse_stream_bytes / warehouse_stream_max_bytes) > 0.80
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "Canonical JetStream log exceeds 80% of its safe capacity" }
      - alert: WarehouseCanonicalLogCritical
        expr: max(warehouse_stream_bytes / warehouse_stream_max_bytes) > 0.95
        for: 10s
        labels: { severity: critical }
        annotations: { summary: "Canonical log is nearly full; new writes will fail closed" }
