    nats://warehouse-route:warehouse-route-b81d6e3a@nats-2:6222
  ]
  authorization {
    user: warehouse-route
    password: "warehouse-route-b81d6e3a"
  }
  tls {
    cert_file: "/etc/nats/tls/warehouse.crt"
    key_file: "/etc/nats/tls/warehouse.key"
