server_name: nats-3
port: 4222
http_port: 8222

authorization {
  user: warehouse
  password: "warehouse-client-9f4c7a2e"
}

tls {
  cert_file: "/etc/nats/tls/warehouse.crt"
  key_file: "/etc/nats/tls/warehouse.key"
