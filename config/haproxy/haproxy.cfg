global
    maxconn 100000

defaults
    mode http
    timeout connect 1s
    timeout check 2s
    timeout client 30s
    timeout server 30s

frontend warehouse_http
    bind *:8080
    bind *:8443 ssl crt /usr/local/etc/haproxy/tls/warehouse.pem alpn h2,http/1.1 ssl-min-ver TLSv1.2
    acl protected_path path_beg /v1/ /metrics
    acl authorized req.hdr(X-API-Key) -m str "${WAREHOUSE_API_TOKEN}"
    http-request deny deny_status 401 if protected_path !authorized
    default_backend warehouse_nodes

backend warehouse_nodes
    option httpchk GET /ready
    http-check expect status 200
    server primary warehouse:8080 check inter 500ms fall 3 rise 2
    server replica warehouse-2:8080 check inter 500ms fall 3 rise 2 backup
