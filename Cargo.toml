[package]
name = "warehouse-lab"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-nats = "0.50"
axum = { version = "0.7", features = ["json"] }
bytes = "1"
crc32fast = "1"
futures = "0.3"
fjall = "=3.1.10"
mimalloc = { version = "=0.1.48", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redb = "=4.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[[bin]]
name = "warehouse-lab"
path = "src/main.rs"

[[bin]]
name = "warehouse-loadgen"
path = "src/bin/loadgen.rs"

[[bin]]
name = "warehouse-chaos"
path = "src/bin/chaos.rs"

[[bin]]
name = "warehouse-prepared-loadgen"
path = "src/bin/prepared_loadgen.rs"
